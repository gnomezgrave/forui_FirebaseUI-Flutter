name: e2e

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/example/**"
      - "**.md"
      - "**.png"
      - "**.jpg"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/example/**"
      - "**.md"
      - "**.png"
      - "**.jpg"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Install Node.js
        with:
          node-version: "22"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Flutter pins ndkVersion to 28.2.13676358 (r28c). Use sdkmanager (not
      # nttld/setup-ndk): its link/cache layout can omit clang and break jni CMake.
      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: android-ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-sdkmanager-28.2.13676358-${{ runner.os }}-flutter-3.47.7
      - name: Install Android NDK
        if: steps.android-ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;28.2.13676358"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-ubuntu-31-google_apis-x86_64
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.7"
          cache: true
      - name: "Install Tools"
        run: |
          sudo npm i -g firebase-tools
          echo "FIREBASE_TOOLS_VERSION=$(firebase --version)" >> "$GITHUB_ENV"
      - name: Firebase Emulator Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v3-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: firebase-emulators-v3-
      - name: Cache functions node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: functions/node_modules
          key: functions-npm-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: functions-npm-
      - uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
        with:
          run-bootstrap: false
          melos-version: "^7.5.0"
      - name: "Bootstrap package"
        run: dart run melos bootstrap --scope tests
      - name: Start Firebase Emulator
        run: |
          cd functions/
          npm i
          npm run build
          ../scripts/start-firebase-emulator.sh
      - name: E2E Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          working-directory: tests
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/firebase_ui_test.dart --dart-define=CI=true -d emulator-5554

  ios:
    runs-on: macos-26
    # Binary Firestore avoids ~25m abseil/gRPC compile; leave headroom for one e2e retry.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for some `pod` commands
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Install Node.js
        with:
          node-version: "22"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
      # Drop unused SDKs only — do not wipe ~/Library/Caches (slow + kills brew/npm).
      # Skip ccache: Xcode 26 does not compile via CC/CXX, so hits stay ~0.
      - name: 'Free up space'
        run: |
          sudo rm -rf \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: iOS Pods and CocoaPods Cache
        id: ios-deps-cache
        with:
          path: |
            tests/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-ios-deps-macos26-v3-${{ hashFiles('tests/ios/Podfile.lock', 'tests/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-ios-deps-macos26-v3-
      # Dominates warm-run time: object files for Firebase/gRPC/abseil. Key includes
      # Flutter pin so a bridging-header .pch from another engine is never restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: iOS Xcode DerivedData Cache
        id: ios-dd-cache
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            tests/build/ios
          key: ios-dd-macos26-flutter3.47.7-${{ hashFiles('tests/ios/Podfile.lock') }}
          restore-keys: ios-dd-macos26-flutter3.47.7-
      - name: "Install Tools"
        run: |
          sudo npm i -g firebase-tools
          echo "FIREBASE_TOOLS_VERSION=$(firebase --version)" >> "$GITHUB_ENV"
      - name: Firebase Emulator Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v3-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: firebase-emulators-v3-
      - name: Cache functions node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: functions/node_modules
          key: functions-npm-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: functions-npm-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.7"
          cache: true
      - uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
        with:
          run-bootstrap: false
          melos-version: "^7.5.0"
      - name: "Bootstrap package"
        run: dart run melos bootstrap --scope tests
      # Podfile pulls Invertase Firestore binaries via unauthenticated
      # `git clone https://github.com/...`. GHA macOS runners intermittently
      # fail that with "Could not resolve host: github.com", and GitHub may
      # also require auth for some public HTTPS clones under load.
      # https://github.blog/changelog/2026-10-19-some-git-over-https-may-temporarily-require-authentication/
      - name: "Authenticate git HTTPS for CocoaPods"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: "Warm Invertase Firestore frameworks (retry)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep in sync with tests/ios/Podfile `:tag => '…'`.
          TAG="$(ruby -e "puts File.read('tests/ios/Podfile')[/firestore-ios-sdk-frameworks\.git.*?tag\s*=>\s*'([^']+)'/m, 1]")"
          if [[ -z "$TAG" ]]; then
            echo "::error::Could not parse Invertase Firestore tag from tests/ios/Podfile"
            exit 1
          fi
          URL="https://github.com/invertase/firestore-ios-sdk-frameworks.git"
          for i in 1 2 3 4 5 6; do
            if git ls-remote --exit-code "$URL" "refs/tags/${TAG}" >/dev/null; then
              echo "Reachable: ${URL} @ ${TAG}"
              exit 0
            fi
            echo "::warning::git ls-remote failed (attempt ${i}/6); sleeping $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::Could not reach ${URL} after retries"
          exit 1
      # Pre-build keeps `flutter test`'s Xcode pass incremental. Cheap now that
      # Firestore ships as Invertase XCFrameworks (see tests/ios/Podfile).
      - name: "Build Application"
        working-directory: tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry once: CocoaPods re-clones the Invertase tag on cache miss and
          # can still hit transient DNS during that clone.
          set +e
          flutter build ios --no-codesign --simulator --debug \
            --target=./integration_test/firebase_ui_test.dart \
            --dart-define=CI=true 2>&1 | tee /tmp/ios-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if ! grep -Eqi 'Could not resolve host|Failed to download|Error installing FirebaseFirestore|unable to access' /tmp/ios-build.log; then
            exit "$status"
          fi
          echo "::warning::CocoaPods/git network failure during iOS build; retrying once"
          sleep 20
          flutter build ios --no-codesign --simulator --debug \
            --target=./integration_test/firebase_ui_test.dart \
            --dart-define=CI=true
      - name: Start Firebase Emulator and proxy
        run: |
          sudo chown -R 501:20 "/Users/runner/.npm"
          cd functions/
          npm i
          npm run build
          ../scripts/start-firebase-emulator.sh
      - uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e # v6
        id: simulator
        with:
          # macos-26 ships iPhone 17 on iOS 26.2/26.4/26.5 — pin OS or the action
          # warns "More than one (3) device matching" and picks arbitrarily.
          # List: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#installed-simulators
          model: "iPhone 17"
          os: iOS
          os_version: "26.5"
      - name: "E2E Tests"
        working-directory: tests
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          # Prefer hardware keyboard so enterText does not raise a software
          # IME that shrinks FScaffold and overflows EmailForm (~225px on CI).
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          xcrun simctl spawn "$SIMULATOR" defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true || true
          # Do not use --no-dds: integration_test goldens need DDS
          # (VmServiceProxyGoldenFileComparator streamListen fails without it).
          set +e
          flutter test ./integration_test/firebase_ui_test.dart \
            -d "$SIMULATOR" \
            --dart-define=CI=true 2>&1 | tee /tmp/ios-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if ! grep -q "Connecting to the VM Service timed out" /tmp/ios-e2e.log; then
            exit "$status"
          fi
          echo "::warning::VM Service connect timed out; resetting simulator and retrying once"
          xcrun simctl terminate "$SIMULATOR" io.flutter.plugins.firebase.tests || true
          xcrun simctl shutdown "$SIMULATOR" || true
          xcrun simctl boot "$SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          flutter test ./integration_test/firebase_ui_test.dart \
            -d "$SIMULATOR" \
            --dart-define=CI=true

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for some `pod` commands
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Install Node.js
        with:
          node-version: "22"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: Xcode Compile Cache
        with:
          key: ${{ runner.os }}-macos26-v1
          max-size: 700M
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Swift Packages and Pods Cache
        id: spm-cache
        with:
          # macOS still needs CocoaPods: facebook_auth_desktop ships no Package.swift.
          path: |
            tests/build/macos/SourcePackages
            tests/macos/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-macos26-deps-v2-${{ hashFiles('tests/macos/Podfile.lock', 'tests/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-macos26-deps-v2-
      - name: "Install Tools"
        run: |
          sudo npm i -g firebase-tools
          echo "FIREBASE_TOOLS_VERSION=$(firebase --version)" >> "$GITHUB_ENV"
      - name: Cache Firebase Emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v3-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: firebase-emulators-v3-
      - name: Cache functions node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: functions/node_modules
          key: functions-npm-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: functions-npm-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.7"
          cache: true
      - uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
        with:
          run-bootstrap: false
          melos-version: "^7.5.0"
      - name: "Bootstrap package"
        run: dart run melos bootstrap --scope tests
      - name: "Build Application"
        working-directory: tests
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          export CCACHE_FILECLONE=true
          export CCACHE_DEPEND=true
          export CCACHE_INODECACHE=true
          ccache -s
          flutter build macos --debug --target=./integration_test/firebase_ui_test.dart --device-id=macos --dart-define=CI=true
          ccache -s
      - name: Start Firebase Emulator and proxy
        run: |
          sudo chown -R 501:20 "/Users/runner/.npm"
          cd functions/
          npm i
          npm run build
          ../scripts/start-firebase-emulator.sh
      - name: "E2E Tests"
        working-directory: tests
        run: flutter test ./integration_test/firebase_ui_test.dart -d macos --dart-define=CI=true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/gmeligio/flutter-web:3.47.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
        with:
          melos-version: "^7.5.0"
      - name: 'Build Test Applications'
        run: |
          cd packages/firebase_ui_auth/example
          flutter build web
          cd ../../firebase_ui_database/example
          flutter build web
          cd ../../firebase_ui_firestore/example
          flutter build web
          cd ../../firebase_ui_storage/example
          flutter build web
