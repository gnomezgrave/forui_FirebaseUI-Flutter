name: firebase_ui_auth
description: Pre-built widgets library that are integrated with the variety of the Firebase Auth providers.
version: 4.0.0
repository: https://github.com/firebase/FirebaseUI-Flutter/tree/master/packages/firebase_ui_auth
homepage: https://github.com/firebase/FirebaseUI-Flutter/tree/master/packages/firebase_ui_auth

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ">=6.4.0 <8.0.0"
  clock: ^1.1.1
  email_validator: ^2.1.17
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_ui_localizations: ^2.1.0
  firebase_ui_oauth: ^3.0.0
  firebase_ui_shared: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  forui: ^0.27.0
  meta: ^1.10.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4

false_secrets:
  - example/**

flutter:
