name: firebase_ui_oauth_google
description: Firebase UI widgets for authentication & OAuth.
version: 3.0.0
homepage: https://github.com/firebase/FirebaseUI-Flutter/tree/master/packages/firebase_ui_oauth_google

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  firebase_auth: ^7.0.0
  firebase_ui_oauth: ^3.0.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.1.0

dev_dependencies:
