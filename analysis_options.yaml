analyzer:
  exclude:
    - "**/build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - build/**
  errors:
    # Flutter 3.50 deprecates material.dart and cupertino.dart in favour of
    # material_ui and cupertino_ui. Ignoring until we migrate.
    deprecated_member_use: ignore
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Ignoring to handle diffenent SDKs on dev machine
    #- unnecessary_ignore
