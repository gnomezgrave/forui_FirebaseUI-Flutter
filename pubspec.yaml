name: forui_firebase_ui_workspace

environment:
  sdk: ^3.13.0

workspace:
  - packages/firebase_ui_auth
  - packages/firebase_ui_auth/example
  - packages/firebase_ui_database
  - packages/firebase_ui_database/example
  - packages/firebase_ui_firestore
  - packages/firebase_ui_firestore/example
  - packages/firebase_ui_localizations
  - packages/firebase_ui_localizations/example
  - packages/firebase_ui_oauth
  - packages/firebase_ui_oauth/example
  - packages/firebase_ui_oauth_apple
  - packages/firebase_ui_oauth_facebook
  - packages/firebase_ui_oauth_google
  - packages/firebase_ui_oauth_twitter
  - packages/firebase_ui_shared
  - packages/firebase_ui_storage
  - packages/firebase_ui_storage/example
  - tests

dev_dependencies:
  melos: ^8.6.0
  path: ^1.9.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

melos:
  repository: https://github.com/gnomezgrave/forui_FirebaseUI-Flutter

  command:
    version:
      linkToCommits: true
      workspaceChangelog: true
      changelogCommitBodies:
        include: true

  scripts:
    lint:
      run: dart run melos run analyze && dart run melos run format
      description: Run all static analysis checks.

    analyze:
      run: |
        dart run melos exec -- dart analyze . --fatal-infos
      description: |
        Run `dart analyze` in all packages.

    # Rewrites package:firebase_ui_* → package:forui_firebase_ui_* (imports + pubspec).
    fix:
      run: dart run forui_firebase_ui_shared:migrate_imports
      description: |
        Migrate upstream Firebase UI imports/deps to forui_firebase_ui_*.

    format:
      run: |
        # SPM checkouts under example/build/**/SourcePackages can contain
        # pubspec.yaml files (e.g. firebase_auth) with resolution: workspace.
        # flutter_plugin_tools discovers them and flutter pub get fails.
        find packages -type d -path '*/build/*/SourcePackages' -exec rm -rf {} + 2>/dev/null || true
        dart pub global run flutter_plugin_tools format && swiftformat .
      description: |
        Formats the code of all packages (Java, Objective-C, and Dart).
         - Requires `flutter_plugin_tools` (`pub global activate flutter_plugin_tools`).
         - Requires `git`.
         - Requires `clang-format` (can be installed via Brew on MacOS).
         - Requires `swiftformat` (can be installed via Brew on macOS).

    test:
      run: |
        dart run melos run test:unit:all
      description: |
        Run all tests available.

    test:unit:all:
      run: |
        dart run melos run test:unit --no-select && \
        dart run melos run test:unit:web --no-select
      description: Run unit tests for all packages.
      packageFilters:
        dirExists:
          - test

    test:unit:
      run: |
        dart run melos exec -c 6 --fail-fast -- "flutter test"
      description: Run `flutter test` for a specific package.
      packageFilters:
        dirExists:
          - test

    test:unit:web:
      run: |
        dart run melos exec -c 1 --fail-fast -- "flutter test --platform=chrome"
      description: Run `flutter test --platform=chrome`.
      packageFilters:
        dirExists:
          - test

    test:build:web:
      run: |
        dart run melos exec -c 1 --fail-fast -- \
          "cd example && flutter build web"
      description: |
        Build all example apps for web platform
      packageFilters:
        dirExists:
          - example

    test:e2e:
      description: |
        Run e2e on macOS. Auto-starts Firebase emulators if needed.
        Prefer platform scripts: test:e2e:macos|ios|android|web.
        Override device with FLUTTER_TEST_DEVICE. Match CI skips with E2E_CI=1.
        If macOS pod install fails on a missing Firebase version, refresh once:
          (cd tests/macos && pod install --repo-update)
      run: bash scripts/run_e2e.sh macos

    test:e2e:macos:
      description: |
        e2e on macOS (same as test:e2e). Auto-starts Firebase emulators if needed.
        Auth persistence tests are skipped without a signed macOS Runner.
      run: bash scripts/run_e2e.sh macos

    test:e2e:ios:
      description: |
        e2e on a connected iOS Simulator/device (auto-picks first simulator).
        Auto-starts Firebase emulators if needed. Boot a simulator first (`open -a Simulator`).
        Override: FLUTTER_TEST_DEVICE=<id>. CI parity: E2E_CI=1 dart run melos run test:e2e:ios
      run: bash scripts/run_e2e.sh ios

    test:e2e:android:
      description: |
        e2e on a connected Android emulator/device (auto-picks first Android device).
        Auto-starts Firebase emulators if needed. Start an AVD first.
        Override: FLUTTER_TEST_DEVICE=emulator-5554.
        Use JDK 21 if Android Studio ships JDK 25 (flutter config --jdk-dir=...).
        CI parity: E2E_CI=1 dart run melos run test:e2e:android
      run: bash scripts/run_e2e.sh android

    test:e2e:web:
      description: |
        Mirror CI web job: build example apps for web (no integration_test web driver).
        Same as test:build:web.
      run: dart run melos run test:build:web

    test:e2e:all:
      description: |
        Run local CI-parity suite: macos → ios → android e2e, then web example builds.
        Auto-starts Firebase emulators if needed; requires iOS Simulator + Android AVD.
        Stops on first failure. Set E2E_CI=1 to match CI dart-defines.
      run: |
        dart run melos run test:e2e:macos &&
        dart run melos run test:e2e:ios &&
        dart run melos run test:e2e:android &&
        dart run melos run test:e2e:web

    # Additional cleanup lifecycle script, executed when `melos clean` is run.
    postclean: >
      dart run melos exec -c 6 -- "flutter clean"

    add-license-header:
      # If you add here another --ignore flag, add it also to
      # "check-license-header".
      run: |
        addlicense -f header_template.txt \
          --ignore "**/*.yml" \
          --ignore "**/*.yaml" \
          --ignore "**/*.xml" \
          --ignore "**/*.g.dart" \
          --ignore "**/*.sh" \
          --ignore "**/*.html" \
          --ignore "**/*.js" \
          --ignore "**/*.ts" \
          --ignore "**/*.g.h" \
          --ignore "**/*.g.m" \
          --ignore "**/*.rb" \
          --ignore "**/*.txt" \
          --ignore "**/*.cmake" \
          --ignore "**/Runner/AppDelegate.swift" \
          --ignore "**/Runner/MainFlutterWindow.swift" \
          --ignore "**/Runner/Runner-Bridging-Header.h" \
          --ignore "**/Runner/AppDelegate.h" \
          --ignore "**/Runner/AppDelegate.m" \
          --ignore "**/Runner/main.m" \
          --ignore "**/MainActivity.kt" \
          --ignore "**/MainActivity.java" \
          --ignore "**/FlutterMultiDexApplication.java" \
          --ignore "**/GeneratedPluginRegistrant.swift" \
          --ignore "**/Pods/**" \
          --ignore "**/flutter/generated_plugin_registrant.h" \
          --ignore "**/flutter/generated_plugin_registrant.cc" \
          .
      description: Add a license header to all necessary files.

    check-license-header:
      # If you add here another --ignore flag, add it also to
      # "add-license-header".
      run: |
        addlicense -f header_template.txt \
          --check \
          --ignore "**/*.yml" \
          --ignore "**/*.yaml" \
          --ignore "**/*.xml" \
          --ignore "**/*.g.dart" \
          --ignore "**/*.sh" \
          --ignore "**/*.html" \
          --ignore "**/*.js" \
          --ignore "**/*.ts" \
          --ignore "**/*.g.h" \
          --ignore "**/*.g.m" \
          --ignore "**/*.rb" \
          --ignore "**/*.txt" \
          --ignore "**/*.cmake" \
          --ignore "**/Runner/**/*" \
          --ignore "**/MainActivity.kt" \
          --ignore "**/MainActivity.java" \
          --ignore "**/FlutterMultiDexApplication.java" \
          --ignore "**/GeneratedPluginRegistrant.swift" \
          --ignore "**/Pods/**" \
          --ignore "**/flutter/generated_plugin_registrant.*" \
          --ignore "**/example/windows/**/*" \
          --ignore "**/Flutter/**/*" \
          --ignore "**/build/**/*" \
          --ignore "**/.dart_tool/**/*" \
          --ignore "**/flutter/plugins/**/*" \
          --ignore "**/build.gradle" \
          --ignore "**/settings.gradle" \
          .
      description: Add a license header to all necessary files.

    emulator:start:
      run: |
        # Free ports left by a previous emulator suite (common after Ctrl-C / crash).
        for port in 4000 5001 8080 9000 9099 9199; do
          pids=$(lsof -nP -tiTCP:$port -sTCP:LISTEN 2>/dev/null || true)
          if [ -n "$pids" ]; then
            echo "Killing process(es) on port $port: $pids"
            kill -9 $pids 2>/dev/null || true
          fi
        done
        firebase emulators:start --only firestore,auth,functions,storage,database --project flutterfire-e2e-tests --import=./emulators-data --export-on-exit=./emulators-data
      description: Start Firebase emulators (kills any existing listeners on emulator ports first).
    update-dependencies:
      run: dart scripts/update_dependencies.dart
